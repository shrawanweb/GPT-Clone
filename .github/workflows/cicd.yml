name: Node.js CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend dependencies
        working-directory: Backend
        run: npm install

      - name: Restore environment file
        run: cp ~/backend-env/.env Backend/.env

      - name: Start or Restart Backend
        working-directory: Backend
        run: |
          sudo pm2 describe backend > /dev/null 2>&1 \
            && sudo pm2 restart backend --update-env \
            || sudo pm2 start server.js --name backend
